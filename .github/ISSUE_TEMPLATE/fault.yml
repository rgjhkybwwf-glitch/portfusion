name: A fault
description: Something PortFusion does that it should not, or a figure that is wrong.
body:
  - type: markdown
    attributes:
      value: >-
        Use the demo book or an invented one. Never paste a real book's rows, figures, statements
        or credentials: an issue is public.
  - type: input
    id: version
    attributes:
      label: Release
      description: What `portfusion --version` prints.
    validations:
      required: true
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, or the page and what you pressed, on which book.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: check
    attributes:
      label: What `portfusion check` says
      description: The guard on the same book, if it fails.
