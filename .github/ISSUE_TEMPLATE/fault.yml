name: Something wrong
description: A page, figure or command that does what it should not. The next ready check finds its cause in the code.
title: "Idea: "
body:
  - type: markdown
    attributes:
      value: >-
        Keep the title's "Idea: " and finish it with what goes wrong, in a few words. The ready
        check keeps your words at the top, quoted, finds the cause by file and function, and places
        it under To rank on the Queue (#206). Leave the labels and
        milestone empty. An issue is public: show it on the demo book, never with a real book's
        rows, figures, statements or credentials.
  - type: textarea
    id: did
    attributes:
      label: What you did
      description: The page and what you pressed, or the command you ran.
    validations:
      required: true
  - type: textarea
    id: saw
    attributes:
      label: What you expected, and what happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release
      description: Optional. What `portfusion --version` prints, or the desk's footer.
