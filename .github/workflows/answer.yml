# THE MAINTAINER'S ANSWERS START THE WORK, IN A BATCH. When the owner answers an issue with a
# comment that begins "Q1:" or "All as recommended", whatever its labels (a `decision` taken off by
# hand hides nothing), this waits thirty minutes, then fires the routine "PortFusion answer" on
# claude.ai, which finds every issue answered by the comments (CONTRIBUTING.md, The answer run).
# Another answer within the thirty minutes cancels the wait and starts it again, so answers given
# together make one run. Nothing of a comment is sent: the routine finds the answers itself. A slip
# in the first words ("All as recomemded") is read as meant.
#
# THE MAINTAINER'S CHANGE OF DIRECTION. A reply from the owner that begins "Change:", on an issue or
# on a pull request from a `claude/` branch, holds the work first: the issue takes `decision`, the
# pull request loses its auto-merge. Then it starts the answer run as an answer does, which reads
# the change and rewrites the issue to match (CONTRIBUTING.md, Asking and answering). A label set by
# this token starts no workflow, so the hold pings no one.
#
# ANY OTHER COMMENT OF THE MAINTAINER'S, on an issue or a `claude/` pull request, is marked 👀 and
# answered in one line from the bot: it starts no run, and the next ready check reads it; on an issue
# labelled `decision`, it was not read as an answer. A comment from this token starts no workflow.
#
# THE MAINTAINER'S YES is their own press of Enable auto-merge, never a reply: a merge by this
# workflow's token would start no workflow, so `guard` would not run on `main` after it and the
# branches beside it would be left (#239, #240, #243).
#
# The routine's fire URL and token are the repository's secrets ROUTINE_ANSWER_URL and
# ROUTINE_ANSWER_TOKEN; without them this says so in its log and does nothing. It prints the
# routine's HTTP status alone: the session's address it answers with stays out of a public log.
#
# THE AGENT WRITES AS THE OWNER'S ACCOUNT TOO, so a comment is the agent's when its first line opens
# with a run's mark (📋 Ready check, 🌙 Night run, 💬 Answer run) or a session's note (**Session
# note**), as CONTRIBUTING.md requires of everything the agent writes. Such a comment is skipped,
# and the log says so; any other text of the owner's, a pasted link included, is theirs.

name: answer

on:
  issue_comment:
    types: [created]

permissions: {}

jobs:
  # Whether this comment is an answer, outside the wait's queue: a comment that is not one never
  # cancels a wait already running for one that is.
  read:
    if: github.event.comment.user.login == github.repository_owner
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      answer: ${{ steps.read.outputs.answer }}
    steps:
      # A reply taken is marked 👀 at once, so the owner sees it was taken before the quiet minutes end.
      - name: Is this comment an answer or a change?
        id: read
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: ${{ github.event.comment.body }}
          REPO: ${{ github.repository }}
          COMMENT: ${{ github.event.comment.id }}
          NUMBER: ${{ github.event.issue.number }}
          IS_PR: ${{ github.event.issue.pull_request && 'yes' || 'no' }}
          DECISION: ${{ contains(github.event.issue.labels.*.name, 'decision') && 'yes' || 'no' }}
        run: |
          first=$(printf '%s\n' "$BODY" | sed -e 's/^[[:space:]]*//' | grep -m1 -v '^$' || true)
          case "$first" in
            "📋 **Ready check**"*|"🌙 **Night run**"*|"💬 **Answer run**"*|"**Session note**"*)
              echo "A comment on #$NUMBER opens with an agent's mark: the agent's, not the owner's. Skipped."
              exit 0 ;;
          esac
          if printf '%s' "$first" | grep -qiE '^change[[:space:]]*:'; then
            if [ "$IS_PR" = yes ]; then
              head=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
              case "$head" in claude/*) ;; *) echo "A change on a pull request not the agent's ($head): left alone."; exit 0 ;; esac
              gh pr merge "$NUMBER" --repo "$REPO" --disable-auto || true
            else
              gh issue edit "$NUMBER" --repo "$REPO" --add-label decision
            fi
            echo "A change on #$NUMBER: held, and the answer run will read it."
          elif [ "$IS_PR" = no ] \
               && printf '%s' "$first" | grep -qiE '^(q[0-9]+[[:space:]]*:|all[[:space:]]+as[[:space:]]+rec)'; then
            echo "An answer on #$NUMBER."
          else
            if [ "$IS_PR" = yes ]; then
              head=$(gh pr view "$NUMBER" --repo "$REPO" --json headRefName --jq .headRefName)
              case "$head" in claude/*) ;; *) echo "A comment on a pull request not the agent's ($head): left alone."; exit 0 ;; esac
            fi
            if [ "$DECISION" = yes ]; then
              note="🤖 **PortFusion agent** · noted, and **not read as an answer**: an answer begins \`Q1:\` or \`All as recommended\`. This comment starts no run; the next ready check reads it."
            else
              note="🤖 **PortFusion agent** · noted: this comment starts no run, and the next ready check reads it. To hold the work and have it read sooner, begin a reply with \`Change:\`."
            fi
            gh api -X POST "repos/$REPO/issues/comments/$COMMENT/reactions" -f content=eyes --silent || true
            gh issue comment "$NUMBER" --repo "$REPO" --body "$note" || true
            echo "Neither an answer nor a change on #$NUMBER: marked and noted, no run started."
            exit 0
          fi
          echo "answer=yes" >> "$GITHUB_OUTPUT"
          gh api -X POST "repos/$REPO/issues/comments/$COMMENT/reactions" -f content=eyes --silent || true

  fire:
    needs: read
    if: needs.read.outputs.answer == 'yes'
    concurrency:
      group: answer
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Wait thirty quiet minutes, then start the answer run
        env:
          NUMBER: ${{ github.event.issue.number }}
          ISSUE: ${{ github.event.issue.html_url }}
          URL: ${{ secrets.ROUTINE_ANSWER_URL }}
          TOKEN: ${{ secrets.ROUTINE_ANSWER_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::warning::An answer on #$NUMBER, but ROUTINE_ANSWER_URL or ROUTINE_ANSWER_TOKEN is not set."
            exit 0
          fi
          echo "A reply on #$NUMBER: the run starts in thirty minutes, unless another reply comes first."
          sleep 1800
          payload=$(jq -n --arg t "Answers were given, the last on #$NUMBER ($ISSUE)." '{text: $t}')
          # A busy or briefly unavailable endpoint (5xx) is tried again, up to four more times.
          # Only the status is printed: the answer names the session, and this log is public.
          status=$(curl -sS -o /dev/null -w '%{http_code}' --retry 4 --retry-delay 30 --retry-all-errors \
            -X POST "$URL" \
            -H "Authorization: Bearer $TOKEN" \
            -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
            -H "anthropic-version: 2023-06-01" \
            -H "Content-Type: application/json" \
            -d "$payload")
          echo "The answer run was asked to start: HTTP $status."
          case "$status" in 2*) ;; *) exit 1 ;; esac
