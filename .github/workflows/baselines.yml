# THE WALK'S LINUX PICTURES, RETAKEN ON A PULL REQUEST THAT CHANGES A PAGE ON PURPOSE. Labelling a
# pull request `baselines` walks the desk on this branch as the guard does, keeps what each page
# now looks like as its `tools/desk_walk/<page>-linux.png`, commits those to a branch beside it,
# `baselines/<branch>`, and takes the label off. The branch's author merges that in and pushes. A
# commit pushed to the pull request by this workflow's token would leave its required `guard`
# waiting for an approval no one gives; the author's push starts the guard as any push does.
# Pictures are kept for Linux alone (docs/testing.md).
#
# Only a branch of this repository: a fork's pull request gets no token that can push. When the pull
# request closes, merged or not, its `baselines/<branch>` is deleted: GitHub's own clean-up deletes a
# pull request's branch, never the one beside it.

name: baselines

on:
  pull_request:
    types: [labeled, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  retake:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'baselines'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python3 -m pip install -q -e '.[dev]' -c requirements.lock
          npm ci --prefix tools --no-audit --no-fund
          npm --prefix tools run browser -- --with-deps
      - name: The desk walked, its Linux pictures retaken
        run: npm --prefix tools run walk -- --update-snapshots
      - name: Push the pictures beside the branch, for the branch's author to merge in
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr edit "$PR" --remove-label baselines
          git add tools/desk_walk/*-linux.png
          if git diff --cached --quiet; then
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · the walk's Linux pictures already match every page; nothing to commit."
            exit 0
          fi
          pages=$(git diff --cached --name-only | sed 's|tools/desk_walk/||; s|-linux.png||' | paste -sd, - | sed 's/,/, /g')
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Retake the walk's Linux pictures: $pages"
          git push --force origin "HEAD:refs/heads/baselines/$BRANCH"
          gh pr comment "$PR" --body "🤖 **PortFusion agent** · the walk's Linux pictures are retaken for: $pages, on \`baselines/$BRANCH\`. Merge it into the branch (\`git fetch origin baselines/$BRANCH && git merge FETCH_HEAD\`) and push: the guard then runs as on any push."

  tidy:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the pictures' branch beside it, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api "repos/$REPO/git/refs/heads/baselines/$BRANCH" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/baselines/$BRANCH"
            echo "Deleted baselines/$BRANCH."
          else
            echo "No baselines/$BRANCH to delete."
          fi
