# THE WALK'S LINUX PICTURES, RETAKEN ON A PULL REQUEST THAT CHANGES A PAGE ON PURPOSE. Labelling a
# pull request `baselines` walks the desk on this branch as the guard does, keeps what each page
# now looks like as its `tools/desk_walk/<page>-linux.png`, commits those to a branch beside it,
# `baselines/<branch>`, and the branch's author merges that in and pushes. A commit pushed to the
# pull request by this workflow's token would leave its required `guard` waiting for an approval no
# one gives; the author's push starts the guard as any push does. Pictures are kept for Linux alone
# (docs/testing.md).
#
# ONLY THE PAGES THE PULL REQUEST NAMES. Its description's `Pictures:` line, copied from the plan,
# names the pages the change means to move; `tools/pictures.py` keeps those, and a picture that
# changed for any other page fails the retake, by name, with nothing pushed. It catches a page moved
# by mistake; the judge is the branch's own copy, so it does not stand against a branch meant to pass.
#
# THE LABEL COMES OFF FIRST, before anything else runs, so it is never left on: GitHub starts this on
# a label being added, and a label already on starts nothing. Adding it again always asks again.
#
# THE WRITE TOKEN STAYS OUT OF THE BRANCH'S CODE. The checkout keeps no credential in git's config,
# so `npm ci` and the walk, which run the branch's own code, find none; the token is given to the
# first step, before the checkout, and to the last, which comments, commits and pushes. The pull
# request's description reaches the judging step by the environment, never in the shell's text.
#
# Only a branch of this repository: a fork's pull request gets no token that can push. When the pull
# request closes, merged or not, its `baselines/<branch>` is deleted: GitHub's own clean-up deletes a
# pull request's branch, never the one beside it.

name: baselines

on:
  pull_request:
    types: [labeled, closed]

concurrency:
  group: baselines-${{ github.event.pull_request.head.ref }}   # one retake a branch at a time

permissions:
  contents: write
  pull-requests: write

jobs:
  retake:
    if: >-
      github.event.action == 'labeled'
      && github.event.label.name == 'baselines'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: The label off, so adding it again asks again
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
        run: gh pr edit "$PR" --remove-label baselines
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install
        run: |
          python3 -m pip install -q -e '.[dev]' -c requirements.lock
          npm ci --prefix tools --no-audit --no-fund
          npm --prefix tools run browser -- --with-deps
      - name: The desk walked, its Linux pictures retaken
        run: npm --prefix tools run walk -- --update-snapshots
      - name: Only the pages the pull request names
        id: judge
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set +e
          said=$(python3 tools/pictures.py $(git ls-files -m -o --exclude-standard -- 'tools/desk_walk/*-linux.png') 2>&1)
          status=$?
          set -e
          { echo "said<<SAID_END"; echo "$said"; echo "SAID_END"; echo "status=$status"; } >> "$GITHUB_OUTPUT"
          echo "$said"
      - name: Push the pictures beside the branch, for the branch's author to merge in
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.html_url }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          SAID: ${{ steps.judge.outputs.said }}
          STATUS: ${{ steps.judge.outputs.status }}
        run: |
          if [ "$STATUS" != 0 ]; then
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · the pictures were not retaken: $SAID"
            exit 1
          fi
          git add tools/desk_walk/*-linux.png
          if git diff --cached --quiet; then
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · the walk's Linux pictures already match every page; nothing to commit."
            exit 0
          fi
          pages=$SAID
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Retake the walk's Linux pictures: $pages"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" "HEAD:refs/heads/baselines/$BRANCH"
          gh pr comment "$PR" --body "🤖 **PortFusion agent** · the walk's Linux pictures are retaken for: $pages, on \`baselines/$BRANCH\`. Merge it into the branch (\`git fetch origin baselines/$BRANCH && git merge FETCH_HEAD\`) and push: the guard then runs as on any push."
      - name: Said on the pull request, when the walk itself fails
        if: failure() && steps.judge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: gh pr comment "$PR" --body "🤖 **PortFusion agent** · the pictures were not retaken: the walk failed before they could be judged ($RUN). Mend it, then label the pull request again."

  tidy:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Delete the pictures' branch beside it, if there is one
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if gh api "repos/$REPO/git/refs/heads/baselines/$BRANCH" --silent 2>/dev/null; then
            gh api -X DELETE "repos/$REPO/git/refs/heads/baselines/$BRANCH"
            echo "Deleted baselines/$BRANCH."
          else
            echo "No baselines/$BRANCH to delete."
          fi
