# A DEPENDABOT BUMP THAT STAYS IN ITS MAJOR VERSION MERGES ITSELF once `guard` is green. A major
# bump, or a pull request whose title names no two versions, is left for the maintainer. Nothing
# here merges: it asks GitHub to, and the `main` ruleset still requires the guard.
#
# No action is used, only `gh`, which the runner carries. The title reaches the shell as a
# variable, never as script.

name: dependabot-merge

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask for the merge, unless the major version moves
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ "$TITLE" =~ from\ v?([0-9]+)[^\ ]*\ to\ v?([0-9]+) ]] \
             && [[ "${BASH_REMATCH[1]}" == "${BASH_REMATCH[2]}" ]]; then
            gh pr merge --auto --merge "$PR"
          else
            echo "left for the maintainer: $TITLE"
          fi
