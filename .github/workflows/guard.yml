# THE GUARD, ON GITHUB. One job, eight checks, each the command run on the Mac: the secret scan
# over every commit, the linter, the import contracts, the type checker, the locks' known
# advisories, a parse of the desk's script, every desk page drawn in Node, and the clean-room test,
# which is the suite on the demo and on a new book from the tracked files, and `portfusion check`
# from the wheel built from them. A pull request is merged on GitHub once this is green
# (CONTRIBUTING.md). `newest`, beside it, is not required (docs/environment.md, Moving the lock).
#
# WHEN IT RUNS: on a pull request and on a push to main, not on every branch push: a branch's
# commits are checked once, through its pull request, rather than twice, a pull request and a push.
#
# Each action is GitHub's own, pinned to a commit, and the repository allows no others.

name: guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true          # a newer push to the same pull request supersedes the run

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          fetch-depth: 0              # the secret scan reads every commit ever made
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: The secret scan, over every commit
        run: .githooks/pre-commit --history
      - name: Install
        run: python3 -m pip install -q -e '.[dev]' -c requirements.lock
      - name: The linter
        run: python3 -m ruff check --no-cache --output-format github
      - name: The import contracts, and a planted import they refuse
        run: |
          lint-imports --no-cache --no-logo
          echo "import portfusion.feeds.ig" >> src/portfusion/record/rules.py
          if lint-imports --no-cache --no-logo --contract the-build > /dev/null; then
            echo "::error::the-build kept with record/rules.py importing a feed"; exit 1
          fi
          git checkout -- src/portfusion/record/rules.py
      - name: The type checker, and a planted error it refuses
        run: |
          pyright
          echo 'planted: int = ""' >> src/portfusion/history/files.py
          if pyright > /dev/null; then
            echo "::error::pyright passed history/files.py with a planted type error"; exit 1
          fi
          git checkout -- src/portfusion/history/files.py
      - name: The locks' known advisories
        run: python3 tools/advisories.py
      - name: The desk's script parses
        run: for f in src/portfusion/desk/static/*.js; do node --check "$f"; done
      - name: Every desk page drawn, and a planted start-up break it refuses
        run: |
          npm ci --prefix tools --no-audit --no-fund
          python3 tools/desk_smoke.py "$RUNNER_TEMP/answers.json"
          node tools/desk_smoke.mjs "$RUNNER_TEMP/answers.json"
          sed -i 's/^  wireSorting();/  wireSortin();/' src/portfusion/desk/static/app.js
          python3 tools/desk_smoke.py "$RUNNER_TEMP/planted.json"
          said=$(node tools/desk_smoke.mjs "$RUNNER_TEMP/planted.json" || true)
          grep -q "start: drew an error: wireSortin is not defined" <<< "$said" \
            || { echo "$said"; echo "::error::the planted start-up break was not refused"; exit 1; }
          git checkout -- src/portfusion/desk/static/app.js
      - name: The clean-room test
        run: python3 tools/clean_room.py

  # THE NEWEST VERSIONS THE FLOORS ALLOW, installed without the lock: the set a book's next
  # install could meet. Not a required check: a red here is a lock to move on purpose.
  newest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install, without the lock
        run: python3 -m pip install -q -e '.[dev]'
      - name: The suite, on the demo
        run: PORTFUSION_BOOK=demo python3 -m pytest -q
