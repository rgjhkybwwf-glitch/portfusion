# THE MAINTAINER IS TOLD WHEN AN AGENT NEEDS THEM, IN THEIR WORKING DAY. A Claude session works as
# the maintainer's own account, and GitHub tells no one of their own comment or pull request, so a
# session's question or finished work would arrive silently. This posts a comment as
# `github-actions[bot]`, a different account, that mentions the owner, and GitHub notifies them as
# for anyone else's comment:
#
# - an issue labelled `decision`: an agent stopped at a choice the issue does not settle;
# - a pull request opened, reopened or marked ready from a `claude/` branch that waits for the yes
#   (auto-merge off). One that merges itself gets no comment: every thread is under the
#   maintainer's account, so a comment of the bot's reaches them whether it names them or not, and
#   a note that asks nothing is written in this run's summary instead.
#
# ONLY IN THE WORKING DAY (08:00 to 17:00 UK time, Monday to Friday; `tools/starts.py` holds the
# hours). Outside it the comment is not posted: the issue or pull request takes the label
# `ask-held`, which tells no one. At 08:00 on the next working day, by this file's own clock, and
# whenever it runs inside the working day, each one so labelled that still waits (the issue still
# `decision`, the pull request still open with auto-merge off) gets its comment, and the label
# comes off. A run the maintainer started tells them itself, in its debrief, at any hour.
#
# GITHUB RUNS THIS CLOCK HOURS LATE (six to nine, 18 to 20 Nov 2026), so 08:00 came at half past
# four. A first clock at midnight UTC comes before the day, and waits for 08:00 here
# (`tools/starts.py --opens-in`), up to five hours; one that would wait longer leaves it to the
# later two, which ask anything still held.
#
# NOTHING IS LEFT PENDING ONCE IT CLOSES (the job `settle`). An issue or pull request that closes
# loses `ask-held` at once. An agent's pull request says where it stands in the first paragraph
# of its top, between `<!-- state -->` and `<!-- /state -->`; when it merges or closes, what is
# between the marks is rewritten to say so, with the time.
#
# The one action used is the checkout of the default branch's `tools/starts.py`, never a pull
# request's; the rest is `gh`, which the runner carries. The token is the workflow's own, so its
# comment and its label start no other workflow. Titles and links reach the shell as variables,
# never as script.

name: notify

on:
  issues:
    types: [labeled, closed]
  pull_request:
    types: [opened, reopened, ready_for_review]
  # `settle` only, which checks out nothing: GitHub runs no `pull_request` workflow for a pull
  # request in conflict, and a stale one is the likeliest to be closed.
  pull_request_target:
    types: [closed, reopened]
  schedule:
    - cron: "17 0 * * 1-5"          # early, since GitHub's clock is late: it waits for 08:00
    - cron: "0 7 * * 1-5"           # 08:00 in London's summer
    - cron: "0 8 * * 1-5"           # 08:00 in London's winter

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  ask:
    if: >-
      github.event_name == 'schedule'
      || (github.event_name == 'issues' && github.event.label.name == 'decision')
      || (github.event_name == 'pull_request'
          && startsWith(github.event.pull_request.head.ref, 'claude/')
          && !github.event.pull_request.draft)
    # One run at a time for each issue or pull request, and one for the clock. A group keeps one
    # run waiting and cancels any it replaces, so a group shared by all would drop a question that
    # came while another run slept its minute; a held question is claimed before it is asked.
    concurrency:
      group: notify-${{ github.event.issue.number || github.event.pull_request.number || 'clock' }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'schedule' && 310 || 10 }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1    # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
      - name: Ask the owner now, or hold the question for their working day
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT: ${{ github.event_name }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
        run: |
          say() { echo "$1" | tee -a "$GITHUB_STEP_SUMMARY"; }
          ask_issue() {
            gh issue comment "$1" --repo "$REPO" --body "🤖 **PortFusion agent** · @$OWNER, a decision is needed here: the questions are under \"Questions for you\", at the end of the issue or of the comment above. Reply with a line each, \"Q1: a\", or \"All as recommended\": an answer as recommended is built, and any other is re-planned first. To take it another way, begin a reply with \"Change:\"."
          }
          ask_pr() {
            gh pr comment "$1" --repo "$REPO" --body "🤖 **PortFusion agent** · @$OWNER, this waits for you: what it needs is at the top. If it is right, press Enable auto-merge, once, and it merges when \`guard\` is green; to change it, begin a reply with \"Change:\"."
          }
          waits() {     # whether pull request $1 is open, ready, and not merging itself
            [ "$(gh pr view "$1" --repo "$REPO" --json state,isDraft,autoMergeRequest \
                 --jq '.state == "OPEN" and (.isDraft | not) and .autoMergeRequest == null')" = true ]
          }
          hold() {      # the question on $1 waits for the working day
            gh label create ask-held --repo "$REPO" --color ededed \
              --description "The bot's question here is asked at 08:00 on the next working day (notify.yml)" > /dev/null 2>&1 || true
            gh api -X POST "repos/$REPO/issues/$1/labels" -f "labels[]=ask-held" --silent
            # The words stand outside the braces: an apostrophe inside "${2:-…}" opens a quote.
            held="#$1: outside the maintainer's working day, so it is asked at 08:00 on the next one."
            say "${2:-$held}"
          }

          # The early clock waits for the day to open; one that would wait over five hours stops.
          if [ "$EVENT" = schedule ]; then
            wait=$(PYTHONPATH=src python3 tools/starts.py --opens-in) || wait=0
            if [ "$wait" -gt 18000 ]; then say "Before the day by more than five hours: a later clock asks."; exit 0; fi
            if [ "$wait" -gt 0 ]; then say "Waiting $((wait / 60)) min for the working day."; sleep $((wait + 5)); fi
          fi

          # Only a clear "no" holds a question: a fault in reading the hours asks now.
          today() {
            day=$(PYTHONPATH=src python3 tools/starts.py --working) || day=fault
            if [ "$day" != no ]; then
              [ "$day" = yes ] || echo "::warning::the working day could not be read ($day): asking now"
              day=yes
            fi
          }
          today

          case "$EVENT" in
            issues)
              if [ "$day" = yes ]; then ask_issue "$NUMBER"; else hold "$NUMBER"; fi ;;
            pull_request)
              # A builder turns auto-merge on just after it marks a clean pull request ready, so this
              # waits a minute to see which it is. One merging itself asks nothing.
              sleep 60
              today     # read again after the minute: one that crosses 08:00 asks now
              if ! waits "$NUMBER"; then
                say "#$NUMBER: auto-merge is on, or it is closed: it asks nothing. Nothing posted."
              elif [ "$day" = yes ]; then ask_pr "$NUMBER"; else hold "$NUMBER"; fi ;;
          esac

          [ "$day" = yes ] || exit 0
          # What was held, and still waits, is asked now. The label comes off first, either way: a
          # run that cannot take it off finds another run has, and leaves that question to it.
          gh api "repos/$REPO/issues?labels=ask-held&state=all&per_page=100" --paginate \
            --jq '.[] | "\(.number) \(if .pull_request then "pr" else "issue" end) \(.state) \([.labels[].name] | index("decision") != null)"' \
            > "$RUNNER_TEMP/held"
          while read -r n kind state decision; do
            gh api -X DELETE "repos/$REPO/issues/$n/labels/ask-held" --silent < /dev/null || continue
            asked=yes
            if [ "$kind" = pr ]; then
              if pr=$(gh pr view "$n" --repo "$REPO" --json state,isDraft,autoMergeRequest \
                   --jq '.state == "OPEN" and (.isDraft | not) and .autoMergeRequest == null' < /dev/null); then
                [ "$pr" != true ] || ask_pr "$n" < /dev/null || asked=no
              else asked=no; fi
            elif [ "$state" = open ] && [ "$decision" = true ]; then
              ask_issue "$n" < /dev/null || asked=no
            fi
            if [ "$asked" = yes ]; then say "#$n: held from before, and now asked if it still waits."
            else
              hold "$n" "::warning::#$n could not be asked: it keeps \`ask-held\`, and the next run tries again" < /dev/null || true
            fi
          done < "$RUNNER_TEMP/held"

  settle:
    # A closed issue or pull request waits on no one: what said it waits is taken back at once, a
    # quiet hold's note from `tiers.yml` among it. A pull request reopened says so, until the run
    # that tends it writes where it stands.
    if: >-
      (github.event_name == 'issues' && github.event.action == 'closed')
      || github.event_name == 'pull_request_target'
    concurrency:
      group: notify-settle-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Take ask-held off, and say on its top how an agent's pull request ended
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number || github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
          HEAD: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged_at }}
          CLOSED: ${{ github.event.pull_request.closed_at }}
        run: |
          if [ "$ACTION" = closed ]; then
            gh api -X DELETE "repos/$REPO/issues/$NUMBER/labels/ask-held" --silent 2> /dev/null || true
          fi
          case "$HEAD" in claude/*) ;; *) exit 0 ;; esac
          gh api "repos/$REPO/pulls/$NUMBER" --jq .body | tr -d '\r' > "$RUNNER_TEMP/was"
          # The marks count only at the start of a line: a sentence that quotes them is left alone.
          grep -q '^<!-- state -->' "$RUNNER_TEMP/was" || exit 0
          if [ "$ACTION" = reopened ]; then at=$(date -u +%FT%TZ); did="**Reopened**, and waits for its run to say where it stands,"
          elif [ -n "$MERGED" ]; then at=$MERGED; did="**Merged**"; else at=$CLOSED; did="**Closed without merging**"; fi
          # A quiet hold's note from `tiers.yml` goes with a close; a reopened one may have just
          # been written, so it stays.
          if [ "$ACTION" = closed ]; then
            awk 'NR == 1 && !/^> 🤖 Held by/ { keep = 1 } keep { print; next } /^$/ { keep = 1 }' \
              "$RUNNER_TEMP/was" > "$RUNNER_TEMP/body"
          else cp "$RUNNER_TEMP/was" "$RUNNER_TEMP/body"; fi
          # The marks stand on lines of their own, so what is between them is read as Markdown.
          SAID="$did on $(TZ=Europe/London date -d "$at" '+%-d %b %Y at %H:%M') UK time."
          export SAID
          perl -0pi -e 's/^<!-- state -->.*?<!-- \/state -->/<!-- state -->\n$ENV{SAID}\n<!-- \/state -->/ms' "$RUNNER_TEMP/body"
          grep -qF "$SAID" "$RUNNER_TEMP/body" || { echo "::warning::#$NUMBER: its state marks could not be rewritten"; exit 0; }
          if ! cmp -s "$RUNNER_TEMP/was" "$RUNNER_TEMP/body"; then
            gh api -X PATCH "repos/$REPO/pulls/$NUMBER" -F "body=@$RUNNER_TEMP/body" --silent
            echo "#$NUMBER: its top now says it is ${ACTION}." >> "$GITHUB_STEP_SUMMARY"
          fi
