# THE MAINTAINER IS TOLD WHEN AN AGENT NEEDS THEM. A Claude session works as the maintainer's own
# account, and GitHub tells no one of their own comment or pull request, so a session's question or
# finished work would arrive silently. This posts a comment as `github-actions[bot]`, a different
# account, that mentions the owner, and GitHub notifies them as for anyone else's comment:
#
# - an issue labelled `decision`: an agent stopped at a choice the issue does not settle;
# - a pull request opened, reopened or marked ready from a `claude/` branch that waits for the yes
#   (auto-merge off). One that merges itself gets the same note without the mention: it asks
#   nothing, so it pings no one.
#
# No action is used, only `gh`, which the runner carries; the token is the workflow's own, so its
# comment starts no other workflow. Titles and links reach the shell as variables, never as script.

name: notify

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  decision:
    if: github.event_name == 'issues' && github.event.label.name == 'decision'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask the owner for the decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue comment "$ISSUE" --body "🤖 **PortFusion agent** · @$OWNER, a decision is needed here: the questions are under \"Questions for you\", at the end of the issue or of the comment above. Reply with a line each, \"Q1: a\", or \"All as recommended\": your reply is the yes, and the agent starts on it. To take it another way, begin a reply with \"Change:\"."

  review:
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.event.pull_request.head.ref, 'claude/')
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The nightly agent turns auto-merge on just after it opens a clean pull request, so the
      # comment waits a minute and says which it is: merging itself, or waiting for the yes.
      - name: Tell the owner it merges itself, or ask for the yes
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sleep 60
          if [ -n "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · this asks nothing, so it merges itself once \`guard\` is green. What changed is above; a merge can be reverted."
          else
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · @$OWNER, this is ready for your review: what it needs from you is at the top. If it is right, reply \"yes\" and it merges once \`guard\` is green; to change it, begin a reply with \"Change:\"."
          fi
