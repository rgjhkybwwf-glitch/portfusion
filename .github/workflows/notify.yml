# THE MAINTAINER IS TOLD WHEN AN AGENT NEEDS THEM. A Claude session works as the maintainer's own
# account, and GitHub tells no one of their own comment or pull request, so a session's question or
# finished work would arrive silently. This posts a comment as `github-actions[bot]`, a different
# account, that mentions the owner, and GitHub notifies them as for anyone else's comment:
#
# - an issue labelled `decision`: an agent stopped at a choice the issue does not settle;
# - a pull request opened, reopened or marked ready from a `claude/` branch that waits for the yes
#   (auto-merge off). One that merges itself gets no comment: every thread is under the
#   maintainer's account, so a comment of the bot's reaches them whether it names them or not, and
#   a note that asks nothing is written in this run's summary instead.
#
# No action is used, only `gh`, which the runner carries; the token is the workflow's own, so its
# comment starts no other workflow. Titles and links reach the shell as variables, never as script.

name: notify

on:
  issues:
    types: [labeled]
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  issues: write
  pull-requests: write

jobs:
  decision:
    if: github.event_name == 'issues' && github.event.label.name == 'decision'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Ask the owner for the decision
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          gh issue comment "$ISSUE" --body "🤖 **PortFusion agent** · @$OWNER, a decision is needed here: the questions are under \"Questions for you\", at the end of the issue or of the comment above. Reply with a line each, \"Q1: a\", or \"All as recommended\": an answer as recommended is built, and any other is re-planned first. To take it another way, begin a reply with \"Change:\"."

  review:
    if: >-
      github.event_name == 'pull_request'
      && startsWith(github.event.pull_request.head.ref, 'claude/')
      && !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # A builder turns auto-merge on just after it opens a clean pull request, so this waits a
      # minute to see which it is. One merging itself asks nothing, so nothing is posted.
      - name: Ask the owner for the yes, unless it merges itself
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          OWNER: ${{ github.repository_owner }}
        run: |
          sleep 60
          if [ -n "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest // empty')" ]; then
            echo "Auto-merge is on: it asks nothing and merges itself once guard is green. Nothing posted." | tee -a "$GITHUB_STEP_SUMMARY"
          else
            gh pr comment "$PR" --body "🤖 **PortFusion agent** · @$OWNER, this waits for you: what it needs is at the top. If it is right, press Enable auto-merge, once, and it merges when \`guard\` is green; to change it, begin a reply with \"Change:\"."
          fi
