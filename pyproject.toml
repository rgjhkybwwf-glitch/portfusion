# THE PROJECT: what the app is called, what it needs, and the one command it installs.
# `requirements.lock` is the exact set the suite was proved on; the floors below are the promise.
#
#   python3 -m venv .venv
#   .venv/bin/python3 -m pip install -e '.[dev]' -c requirements.lock
#   source .venv/bin/activate
#
# docs/environment.md says why each checkout has its own venv, and what breaks one.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "portfusion"             # PortFusion, the app
description = "An investment book's own record: its engine, a desk and a quarterly report."
readme = "README.md"
# THE FLOOR IS WHAT HAS BEEN RUN: 3.13 is the only Python the suite has passed on. The locked
# numpy needs 3.12 and the locked pandas 3.11, so a lower floor waits for a run that proves it.
requires-python = ">=3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dynamic = ["version"]
# FLOORS, NOT PINS. Nothing below a floor has been run; the lock says what has.
# THE BUILD (the report and the engine) needs pandas alone; the rest is the desk's, beside it.
# The build may not import desk/, feeds/ or history/ (the import contracts below).
dependencies = [
    "pandas>=2.2.3",    # the engine. Written on pandas 3; numpy comes with it
    "fastapi>=0.133",   # desk/app.py
    "uvicorn>=0.32",    # serves the desk on localhost
    "pypdf>=6.21.2",    # a PDF's text: a document on the Bench, a filed IG statement's closes
    "webauthn>=3.0",    # passkeys for the hosted desk's sign-in (desk/auth.py)
    # THE GUARD SHIPS WITH THE APP: `portfusion check` runs the suite on whichever book is loaded.
    "pytest>=8.4",      # the guard
    "httpx2>=2.13",     # Starlette's TestClient requests the desk's routes with it in tests
]

[project.optional-dependencies]
dev = [
    "ruff>=0.17",               # the linter: python3 -m ruff check
    "import-linter>=2.15",      # the import contracts below: lint-imports
    "pyright>=1.1.414",         # the type checker below: pyright
    "pandas-stubs>=3.0.5",      # pandas' types, for pyright
]

[project.scripts]
portfusion = "portfusion.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "portfusion.__version__" }   # the release: portfusion/__init__.py

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# THE SUITE, as files and not a package: no __init__.py, so pytest imports each test by its own
# folder exactly as it does in a checkout, and `from harness import …` keeps working.
"portfusion" = ["tests/*.py", "tests/pytest.ini", "tests/desk/*.py",
                 # THE DEMO BOOK, so an installed copy has a book to show and `portfusion init --practice` to copy
                 "demo/store/*.csv", "demo/_archive/**/*", "demo/checks/*"]
"portfusion.desk" = ["static/*"]
"portfusion.house" = ["fonts/*"]

# THE LINTER: pyflakes (a name unused, undefined or redefined) and the pycodestyle errors that are
# not layout. The guard runs it (tests/test_code.py) and so does the workflow. Its formatter is not
# adopted: it would undo the aligned columns the code is written in.
[tool.ruff]
target-version = "py313"
line-length = 100               # what the code is written to; E501 is not selected
extend-include = [".githooks/pre-commit", ".githooks/pre-push"]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W"]

[tool.ruff.lint.per-file-ignores]
# It checks that the book's store is whole BEFORE importing the rest of the record, so a missing
# table says what is wrong rather than failing three frames deep.
"src/portfusion/record/rules.py" = ["E402"]

# THE TYPE CHECKER: pyright, standard mode, on the packages it holds to no error, checked in CI's
# guard and in this checkout's `.githooks/pre-commit`. A dev tool: a book installs none of it.
# STILL TO WIDEN TO: the Book's files in engine/, and desk/ and feeds/ as stage 3 splits each.
[tool.pyright]
include = ["src/portfusion/record", "src/portfusion/report", "src/portfusion/house",
           "src/portfusion/history", "src/portfusion/engine/__init__.py",
           "src/portfusion/engine/store.py", "src/portfusion/engine/bases.py",
           "src/portfusion/engine/ledger.py", "src/portfusion/engine/valuation.py"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

# THE IMPORT CONTRACTS: which part of the app may import which, checked by `lint-imports` in CI's
# guard (beside a planted import it must refuse) and in this checkout's `.githooks/pre-commit`.
# A dev tool: a book installs none of it.
[tool.importlinter]
root_package = "portfusion"
include_external_packages = true        # so a contract can forbid pandas or the network

# A module imports only from the layers below it; parts on one line never import each other, and
# a new part must be given a layer. The desk's own layers wait for its split.
[[tool.importlinter.contracts]]
id = "layers"
name = "a module imports only from the layers below it"
type = "layers"
containers = ["portfusion"]
exhaustive = true
layers = [
    "__main__ | hooks | init | migrate",
    "desk",
    "feeds | report",
    "engine | history",
    "about | brand | check",
    "record",
    "house | log | secret_scan",
]
ignore_imports = [                      # the audit, `portfusion record`, runs the engine and the suite
    "portfusion.record.__main__ -> portfusion.engine",
    "portfusion.record.__main__ -> portfusion.about",
    "portfusion.record.__main__ -> portfusion.brand",
    "portfusion.record.__main__ -> portfusion.check",
]

# Stability rule 21: directly or through any other module.
[[tool.importlinter.contracts]]
id = "the-build"
name = "the build (engine, record, report) imports no desk, feed or history"
type = "forbidden"
source_modules = ["portfusion.engine", "portfusion.record", "portfusion.report"]
forbidden_modules = ["portfusion.desk", "portfusion.feeds", "portfusion.history"]

[[tool.importlinter.contracts]]
id = "the-engine"
name = "the engine takes nothing of the app but the record's rules"
type = "forbidden"
source_modules = ["portfusion.engine"]
forbidden_modules = ["portfusion.record.schema", "portfusion.report", "portfusion.about",
                     "portfusion.brand", "portfusion.house", "portfusion.check", "portfusion.log"]
allow_indirect_imports = true

# Book's topics reach one another through `self`, never by import, so the engine has no cycle.
[[tool.importlinter.contracts]]
id = "the-engine-inside"
name = "inside the engine, a file imports only from those below it, and no topic from another"
type = "layers"
containers = ["portfusion.engine"]
exhaustive = true
layers = [
    "book",
    "positions | trades | accounts | reconciliation | quarters | past | findings",
    "core",
    "valuation",
    "ledger",
    "store | bases",
]

[[tool.importlinter.contracts]]
id = "the-report"
name = "the report reads facts through record.rules, never record.schema"
type = "forbidden"
source_modules = ["portfusion.report"]
forbidden_modules = ["portfusion.record.schema"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "one-palette"
name = "desk/app.py serves engine.tokens_css(), never deriving colours from house"
type = "forbidden"
source_modules = ["portfusion.desk.app"]
forbidden_modules = ["portfusion.house"]
allow_indirect_imports = true

# Direct imports only: the desk's engine reaches a feed through the Bench, which the split unties.
[[tool.importlinter.contracts]]
id = "the-proposer"
name = "the proposer imports no feed and nothing that opens a connection"
type = "forbidden"
source_modules = ["portfusion.desk.intake.propose"]
forbidden_modules = ["portfusion.feeds", "urllib", "http", "socket", "requests", "httpx",
                     "anthropic"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
id = "the-drop-off"
name = "the drop-off never reaches the record's rules, the engine or pandas"
type = "forbidden"
source_modules = ["portfusion.desk.intake.dropoff"]
forbidden_modules = ["portfusion.record.rules", "portfusion.engine", "pandas"]
allow_indirect_imports = true
