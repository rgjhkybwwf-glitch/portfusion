[pytest]
# THE SUITE SHIPS INSIDE THE APP, at src/portfusion/tests/, so an installed copy can run it on its
# own book (`portfusion check`). This file only points a checkout's `python3 -m pytest` at it.
# Everything else a run is configured with is the harness's own (`pytest_configure` there), so a
# checkout and an installed copy run the suite one way.
#
# THE HARNESS is a plugin rather than a conftest so its fixtures reach a book's own checks, which
# live in that book's folder and not beside the suite.
testpaths = src/portfusion/tests
pythonpath = src/portfusion/tests
addopts = -p harness
