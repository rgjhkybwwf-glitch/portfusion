<!doctype html>
<meta charset="utf-8">
<title><!-- title --></title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="/favicon.png">

<!-- ADDED TO THE DOCK AS A SAFARI WEB APP, from 6 September 2026. Safari takes the Dock icon
     from `apple-touch-icon` and the app's name from `apple-mobile-web-app-title`; without them
     the Dock shows a generic page icon and the window is titled with the whole <title>. Both
     degrade SILENTLY, which is why a test holds the icon links against the routes they name.
     The app's name is the tab's own, and the same test holds the two alike.
     `theme-color` paints the window chrome to match the page in each scheme.

     THE DOCK WEARS THE FULL MARK, square and opaque, the book's own app icon or PortFusion's:
     180 for the name iOS asks for, 512 to stay sharp at the Dock's magnification. Chrome and
     Android read the manifest, which names the same files. desk/bundle.py says which surface
     reads which icon. -->
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="<!-- title -->">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E0F16" media="(prefers-color-scheme: dark)">
<!-- WHICH SET OF FILES THIS PAGE IS, filled in by desk/bundle.py. The hosted page checks it
     against the Mac's before drawing anything. -->
<meta name="desk-version" content="">

<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/static/app.css">

<!-- THE SHELL: the book's lockup in a bar, then a rail
     beside the work. The rail holds the pages in the order of the work, joined by a thread, the
     two pages apart from the work below a rule, and the freshness line under them; on a phone it
     folds behind one button. -->
<header class="bar">
  <!-- THE BOOK'S LOCKUP, filled in by desk/bundle.py from portfusion.brand: one statement of the mark. -->
  <div class="brand"><!-- lockup --><span class="desk-name">The desk</span></div>
  <button class="pages-toggle" id="pages-toggle" type="button" aria-expanded="false"
          aria-controls="rail">Pages</button>
</header>

<div class="frame">
  <aside class="rail" id="rail">
    <nav class="tabs" id="tabs" aria-label="Pages"></nav>
    <div class="fresh" id="fresh"></div>
  </aside>

  <main id="main"><p class="loading">reading the store…</p></main>
</div>

<footer class="foot">
  <span><!-- footer --></span>
</footer>

<script src="/static/app.js"></script>
